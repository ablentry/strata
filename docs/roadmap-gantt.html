<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strata roadmap · 2026 plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Gantt · Strata roadmap</p>
    <h1>Strata roadmap · four quarters</h1>

    <!-- viewBox 0 0 1000 500. Timeline x=200-956 = 756px / 12 quarters = 63px per quarter -->
    <!-- Rows: label col x=20-196, timeline x=200-956 -->
    <!-- Row height=40, bar h=24, bar top pad=8 -->
    <!-- Quarter x = 200 + i*63, i=0..12. Q labels: Q1'26 i=0, Q2 i=1, Q3 i=2, Q4 i=3, Q1'27 i=4 ... -->
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gantt-title gantt-desc">
      <title id="gantt-title">Strata roadmap · four quarters</title>
      <desc id="gantt-desc">Gantt chart of the Strata roadmap: parser robustness and wrong-result triage in flight, then split raw sets, shadow copies and EWF v2, then encrypted volumes, ANSI PST, $LogFile and cross-fragment carving.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Theme zones (drawn before everything) -->
      <!-- Phase 1 CORRECTNESS: rows y=84,124 → zone y=72, h=84 -->
      <rect x="12" y="72" width="976" height="84" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <!-- Phase 2 REACH: rows y=184,224,264 → zone y=172, h=120 -->
      <rect x="12" y="172" width="976" height="120" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <!-- Phase 3 LATER: rows y=324,364 → zone y=312, h=88 -->
      <rect x="12" y="312" width="976" height="88" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <!-- Quarter headers at y=40-56 -->
      <text x="326" y="52" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Q1–Q2 '26</text>
      <text x="578" y="52" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Q3–Q4 '26</text>
      <text x="830" y="52" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">'27 →</text>

      <!-- Half-year separator lines -->
      <line x1="452" y1="36" x2="452" y2="416" stroke="rgba(45,49,66,0.08)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="704" y1="36" x2="704" y2="416" stroke="rgba(45,49,66,0.08)" stroke-width="0.8" stroke-dasharray="3,3"/>

      <!-- Quarter gridlines (vertical, hairline) -->
      <line x1="263" y1="60" x2="263" y2="416" stroke="rgba(45,49,66,0.05)" stroke-width="0.6"/>
      <line x1="326" y1="60" x2="326" y2="416" stroke="rgba(45,49,66,0.05)" stroke-width="0.6"/>
      <line x1="389" y1="60" x2="389" y2="416" stroke="rgba(45,49,66,0.05)" stroke-width="0.6"/>
      <line x1="515" y1="60" x2="515" y2="416" stroke="rgba(45,49,66,0.05)" stroke-width="0.6"/>
      <line x1="578" y1="60" x2="578" y2="416" stroke="rgba(45,49,66,0.05)" stroke-width="0.6"/>
      <line x1="641" y1="60" x2="641" y2="416" stroke="rgba(45,49,66,0.05)" stroke-width="0.6"/>
      <line x1="767" y1="60" x2="767" y2="416" stroke="rgba(45,49,66,0.05)" stroke-width="0.6"/>
      <line x1="830" y1="60" x2="830" y2="416" stroke="rgba(45,49,66,0.05)" stroke-width="0.6"/>
      <line x1="893" y1="60" x2="893" y2="416" stroke="rgba(45,49,66,0.05)" stroke-width="0.6"/>

      <!-- Timeline header line -->
      <line x1="200" y1="60" x2="956" y2="60" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <!-- Left divider -->
      <line x1="200" y1="36" x2="200" y2="416" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>

      <!-- Theme labels (eyebrow style) -->
      <text x="20" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CORRECTNESS</text>
      <text x="20" y="185" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">REACH</text>
      <text x="20" y="325" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LATER</text>

      <!-- ─── TASK BARS ─── -->
      <!-- W_x = 200 + quarter_index * 63 -->
      <!-- Row 1 y=84 FOCAL: Fuzzer findings Q1 (i=0, x=200, dur=63) -->
      <rect x="20"  y="92" width="176" height="24" fill="#f5f5f5"/>
      <text x="20"  y="108" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Parser robustness</text>
      <rect x="200" y="92" width="63" height="24" rx="4" fill="#f5f5f5"/>
      <rect x="200" y="92" width="63" height="24" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="231" y="109" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">#15</text>

      <!-- Row 2 y=124: Wrong-result triage Q1-Q4 (i=0..3, x=200, dur=4*63=252) -->
      <rect x="20"  y="132" width="176" height="24" fill="#f5f5f5"/>
      <text x="20"  y="148" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Wrong-result triage</text>
      <rect x="200" y="132" width="252" height="24" rx="4" fill="#f5f5f5"/>
      <rect x="200" y="132" width="252" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>

      <!-- Row 3 y=184: Split raw sets Q3-Q4 '26 (i=2..3, x=326, dur=2*63=126) -->
      <rect x="20"  y="192" width="176" height="24" fill="#f5f5f5"/>
      <text x="20"  y="208" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Split raw sets</text>
      <rect x="326" y="192" width="126" height="24" rx="4" fill="#f5f5f5"/>
      <rect x="326" y="192" width="126" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>

      <!-- Row 4 y=224: Shadow copies Q3 '26 → Q2 '27 (i=2..6, x=326, dur=4*63=252) -->
      <rect x="20"  y="232" width="176" height="24" fill="#f5f5f5"/>
      <text x="20"  y="248" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Shadow copies (VSS)</text>
      <rect x="326" y="232" width="252" height="24" rx="4" fill="#f5f5f5"/>
      <rect x="326" y="232" width="252" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>

      <!-- Row 5 y=264: EWF v2 Q4 '26 → Q1 '27 (i=3..4, x=389, dur=2*63=126) -->
      <rect x="20"  y="272" width="176" height="24" fill="#f5f5f5"/>
      <text x="20"  y="288" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">EWF v2 (Ex01)</text>
      <rect x="389" y="272" width="126" height="24" rx="4" fill="#f5f5f5"/>
      <rect x="389" y="272" width="126" height="24" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>

      <!-- Row 6 y=324: LUKS2 / FileVault / diffuser, dashed, Q2 '27 → (i=5.., x=515, dur=6*63=378) -->
      <rect x="20"  y="332" width="176" height="24" fill="#f5f5f5"/>
      <text x="20"  y="348" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Encrypted volumes</text>
      <rect x="515" y="332" width="378" height="24" rx="4" fill="#f5f5f5"/>
      <rect x="515" y="332" width="378" height="24" rx="4" fill="rgba(79,93,117,0.06)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Row 7 y=364: $LogFile · ANSI PST · cross-fragment carve, dashed (i=5.., x=515, dur=6*63=378) -->
      <rect x="20"  y="372" width="176" height="24" fill="#f5f5f5"/>
      <text x="20"  y="388" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">PST · $LogFile · carving</text>
      <rect x="515" y="372" width="378" height="24" rx="4" fill="#f5f5f5"/>
      <rect x="515" y="372" width="378" height="24" rx="4" fill="rgba(79,93,117,0.06)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Today marker: release 0.1.0, start of Q1 '26 (x=200) -->
      <line x1="200" y1="66" x2="200" y2="416" stroke="#4f5d75" stroke-width="1" stroke-dasharray="2,4"/>
      <text x="206" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">v0.1.0</text>

      <!-- Legend -->
      <line x1="40" y1="430" x2="960" y2="430" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="456" width="20" height="12" rx="3" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="68" y="466" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">In flight</text>

      <rect x="130" y="456" width="20" height="12" rx="3" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="158" y="466" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Scheduled</text>

      <rect x="228" y="456" width="20" height="12" rx="3" fill="rgba(79,93,117,0.06)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="256" y="466" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">No committed release</text>

      <rect x="404" y="456" width="20" height="12" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="432" y="466" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Theme</text>
    </svg>
  </div>
</body>
</html>
